<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heap Master Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><i class="fas fa-cubes"></i> Heap Master Pro</div>
        <button id="themeToggle"><i class="fas fa-moon"></i></button>
    </header>
    <div class="dashboard">
        <aside class="sidebar">
            <!-- Pad Management -->
            <div class="panel-block">
                <h2 class="block-title">مدیریت پدها</h2>
                <select id="padSelect"></select>
                <div class="pad-controls">
                    <button id="addPadRight">کنار هم (راست)</button>
                    <button id="addPadFront">کنار هم (جلو)</button>
                    <button id="addPadTop">طبقه بالا</button>
                </div>
                <button id="deletePadBtn">حذف پد</button>
            </div>

            <!-- Geometry Inputs -->
            <div class="panel-block">
                <h2 class="block-title">هندسه و ابعاد</h2>
                <div class="input-row">
                    <div class="input-group"><label>نام</label><input type="text" id="inpName"></div>
                    <div class="input-group"><label>طبقه</label><input type="number" id="inpLift" readonly></div>
                </div>
                <div class="input-row">
                    <div class="input-group"><label>طول (L)</label><input type="number" id="inpL"></div>
                    <div class="input-group"><label>عرض (W)</label><input type="number" id="inpW"></div>
                    <div class="input-group"><label>ارتفاع (H)</label><input type="number" id="inpH"></div>
                </div>
                 <div class="input-row">
                    <div class="input-group"><label>X</label><input type="number" id="inpX"></div>
                    <div class="input-group"><label>Z</label><input type="number" id="inpZ"></div>
                </div>
            </div>

            <!-- Other inputs can be added here -->

        </aside>
        <main class="main-content">
            <div class="main-header">
                <h1>گزارش و نتایج</h1>
                <button id="exportPdfBtn">خروجی PDF</button>
            </div>
            <div id="results-container">
                <!-- Results will be dynamically inserted here -->
            </div>
        </main>
    </div>

    <div class="modal-3d" id="modal3D">
        <div class="modal-bar">
            <button id="closeModalBtn">بستن</button>
        </div>
        <div id="canvas-wrapper"></div>
    </div>

    <button id="openModalBtn" class="fab-3d"><i class="fas fa-cube"></i> نمای سه‌بعدی</button>

    <script src="script.js"></script>
</body>
</html>
